scene:
  seed: 0
  # Table-front camera is on world +X; the Panda is behind the drawer and the
  # handle faces the camera, matching the real drawer demonstrations.
  drawer_x: -0.06
  drawer_y: 0.0
  drawer_yaw: 0.0
  initial_open: 0.0
  num_manipulated_points: 256
  num_reference_points: 256
  num_full_manipulated_points: 30000
  num_complete_scene_points: 60000
  shader: default

motion:
  seed: 42
  device: cuda:0
  axis_length: 0.025

execution:
  seed: 0
  fps: 30
  robot_uid: panda_drawer_finger
  pregrasp_distance: 0.08
  # 0.0 maps to about 30 mm total jaw opening in the ManiSkill Panda
  # controller.  Pre-shaping prevents the rear long finger from descending
  # over the cabinet top before entering the handle gap.
  approach_gripper_action: 0.0
  # Calibrated using tools/calibrate_drawer_grasp_reachability.py; -0.055 and
  # -0.060 m both acquire the handle, and -0.060 centres the contact patch.
  grasp_offset_local: [0.0, 0.0, -0.060]
  move_waypoints: 28
  approach_waypoints: 18
  settle_steps: 3
  trajectory_substeps: 4
  close_steps: 45
  post_close_hold_steps: 15
  hold_steps: 20
  project_drawer_axis: true
  drawer_max_pull: 0.085
