experiment_name: two_stage_contact_grasp_motion_base

stages:
  contact_grasp:
    config: configs/experiments/contact_grasp/base.yaml
  functional_motion:
    config: configs/experiments/functional_motion/base.yaml
  robot_selection:
    package: lfv.robot
    criteria:
      - continuous_ik_success
      - joint_delta
      - joint_limit_margin
      - smoothness
      - collision

outputs:
  root: /media/ljian/lj/lfv_model_outputs
  save_contact_samples: true
  save_grasp_candidates: true
  save_motion_samples: true
  save_robot_feasibility_report: true

