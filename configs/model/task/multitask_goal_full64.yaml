instruction: "Place the banana on the plate"

shape_meta: &shape_meta
  obs:
    agent_pos:
      shape: [7]
      type: low_dim
    pc_manipulated:
      shape: [64, 3]
      type: point_cloud
    pc_target:
      shape: [64, 3]
      type: point_cloud
    goal_pose9d:
      shape: [9]
      type: low_dim
    goal_delta_pose9d:
      shape: [9]
      type: low_dim
    goal_delta_pose7d:
      shape: [7]
      type: low_dim
