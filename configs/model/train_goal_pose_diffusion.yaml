defaults:
  - _self_
  - task: goal_pose_multitask

name: train_goal_pose_diffusion
exp_name: "goal_pose_diffusion"

task_name: ${task.task_name}
shape_meta: ${task.shape_meta}

policy:
  _target_: diffusion_policy_3d.policy.goal_pose_diffuser.GoalPoseDiffuser
  shape_meta: ${shape_meta}
  use_lang_emb: true
  goal_dim: 9
  encoder_dim: 256
  prediction_type: sample
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: sample
  num_inference_steps: 10
  loss_weights:
    pose9d: 1.0
    trans: 1.0
    rot: 0.5
    cloud: 0.1

ema:
  _target_: diffusion_policy_3d.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: false
  pin_memory: true
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  output_root: data/outputs/goal_pose
  debug: false
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 1500
  gradient_accumulate_every: 1
  use_ema: true
  checkpoint_every: 100
  val_every: 20
  sample_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  group: ${exp_name}
  mode: offline
  name: ${task.task_name}_seed${training.seed}
  project: goal-pose-diffusion
  resume: false
  tags:
    - goal_pose
    - diffusion
    - rpdiff_style

checkpoint:
  save_ckpt: true
  topk:
    monitor_key: val_sample_goal_pos_err_cm
    mode: min
    k: 3
    format_str: 'epoch={epoch:04d}-val_sample_goal_pos_err_cm={val_sample_goal_pos_err_cm:.3f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

hydra:
  run:
    dir: ${training.output_root}
