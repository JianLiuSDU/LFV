# v6 balanced setting: moderate smooth sharpening and a low-weight
# differentiable peak-removal probe, chosen after v5's collapse diagnostic.
model:
  name: three_token_hierarchical_diffusion
  hidden_dim: 128
  encoder_heads: 4
  motion_field_mode: joint
  motion_field_temperature: 0.10
  motion_field_power: 1.5
  motion_field_pair_weight: 0.25
  motion_field_fusion_mode: confidence
  motion_field_bottleneck: true
  motion_field_causal_weight: 0.10
  motion_field_causal_margin: 0.01
  motion_field_drop_top_weight: 0.10
  motion_field_consistency_weight: 0.02
  motion_field_consistency_temperature: 0.15
  motion_field_consistency_max_points: 64
  goal_layers: 4
  trajectory_layers: 6
  decoder_heads: 4
  dropout: 0.1
  num_train_timesteps: 100
  goal_inference_steps: 20
  trajectory_inference_steps: 20
  trajectory_hard_start_token: true
  trajectory_position_encoding: discrete_sinusoidal
  trajectory_goal_context_layers: 2
  trajectory_goal_context_residual_gating: true
  trajectory_num_phase_tokens: 4
  trajectory_phase_attention_sigma: 0.22
  trajectory_phase_residual_gating: true
  trajectory_temporal_attention_mode: full
  trajectory_temporal_local_window: 7
  trajectory_residual_gating: false
  trajectory_residual_gate_init: 0.1
  trajectory_velocity_weight: 0.5
  trajectory_endpoint_weight: 1.0
  trajectory_start_reconstruction_weight: 20.0
  trajectory_start_boundary_weight: 2.0
  trajectory_acceleration_weight: 0.1

data:
  type: cached
  cache_root: /home/users1/ljian/lfv_data_cache/stage2/pouring_lfv_v1
  dino_dim: 384
  shuffle_points: true
  consistency_group_fallback: pouring_source_instance

runtime:
  seed: 42
  device: cpu
  allow_cpu_fallback: true

optimization:
  learning_rate: 0.0001
  min_learning_rate: 0.000001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  ema_decay: 0.995
  amp: false

training:
  stage: joint
  batch_size: 32
  num_workers: 0
  epochs: 40
  early_stopping_patience: 12

paths:
  output_dir: /home/users1/ljian/lfv_runs/stage2/motion_functional_field/v6_balanced_pouring_lfv
