# V7 Source-Canonical Functional Alignment.
# This configuration is independent from all V2/V6 configs.
model:
  name: v7_functional_alignment
  motion_field_mode: local_functional_bottleneck
  hidden_dim: 128
  encoder_heads: 4
  local_dino_proj_dim: 64
  local_object_xyz_dim: 32
  local_relation_xyz_dim: 32
  field_selector_layers: 2
  field_selector_ffn_dim: 256
  field_selector_dropout: 0.1
  field_temperature_start: 1.0
  field_temperature_end: 0.4
  gated_relation_layers: 2
  gated_relation_ffn_dim: 256
  functional_pooling_queries: 4
  field_target_ratio_start: 0.50
  field_target_ratio_end: 0.20
  field_knn: 8
  field_budget_weight: 0.02
  field_smooth_weight: 0.01
  field_consistency_weight: 0.02
  field_consistency_temperature: 0.15
  field_consistency_max_points: 64
  goal_layers: 4
  trajectory_layers: 6
  decoder_heads: 4
  dropout: 0.1
  num_train_timesteps: 100
  goal_inference_steps: 20
  trajectory_inference_steps: 20
  trajectory_hard_start_token: true
  trajectory_position_encoding: discrete_sinusoidal
  trajectory_goal_context_layers: 2
  trajectory_goal_context_residual_gating: true
  trajectory_num_phase_tokens: 4
  trajectory_phase_attention_sigma: 0.22
  trajectory_phase_residual_gating: true
  trajectory_temporal_attention_mode: full
  trajectory_temporal_local_window: 7
  trajectory_residual_gating: false
  trajectory_residual_gate_init: 0.1
  trajectory_velocity_weight: 0.5
  trajectory_endpoint_weight: 1.0
  trajectory_start_reconstruction_weight: 20.0
  trajectory_start_boundary_weight: 2.0
  trajectory_acceleration_weight: 0.1

data:
  type: cached
  cache_root: /home/users1/ljian/lfv_data_cache/stage2/pouring_lfv_v1
  dino_dim: 384
  shuffle_points: true

runtime:
  seed: 42
  device: cuda
  allow_cpu_fallback: false

optimization:
  learning_rate: 0.0001
  min_learning_rate: 0.000001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  ema_decay: 0.995
  amp: true

training:
  stage: joint
  batch_size: 16
  num_workers: 0
  epochs: 300
  early_stopping_patience: 80

paths:
  output_dir: /home/users1/ljian/lfv_runs/stage2/motion_functional_field/v7_functional_alignment_pouring_lfv

