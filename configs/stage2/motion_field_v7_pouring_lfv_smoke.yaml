# One-epoch real-cache smoke test; not a research checkpoint.
model:
  name: v7_functional_alignment
  motion_field_mode: local_functional_bottleneck
  hidden_dim: 128
  encoder_heads: 4
  local_dino_proj_dim: 64
  local_object_xyz_dim: 32
  local_relation_xyz_dim: 32
  field_selector_layers: 2
  field_selector_ffn_dim: 256
  field_selector_dropout: 0.0
  field_temperature_start: 1.0
  field_temperature_end: 0.4
  gated_relation_layers: 2
  gated_relation_ffn_dim: 256
  functional_pooling_queries: 4
  field_target_ratio_start: 0.50
  field_target_ratio_end: 0.20
  field_knn: 8
  field_budget_weight: 0.02
  field_smooth_weight: 0.01
  field_consistency_weight: 0.0
  goal_layers: 1
  trajectory_layers: 1
  decoder_heads: 4
  dropout: 0.0
  num_train_timesteps: 10
  goal_inference_steps: 2
  trajectory_inference_steps: 2
  trajectory_hard_start_token: true
  trajectory_position_encoding: discrete_sinusoidal
  trajectory_goal_context_layers: 0
  trajectory_num_phase_tokens: 0

data:
  type: cached
  cache_root: /home/users1/ljian/lfv_data_cache/stage2/pouring_lfv_v1
  dino_dim: 384
  shuffle_points: true
  strict_instance_split: false
  train_limit: 4
  val_limit: 2

runtime:
  seed: 42
  device: cpu
  allow_cpu_fallback: true

optimization:
  learning_rate: 0.0001
  min_learning_rate: 0.000001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  ema_decay: 0.995
  amp: false

training:
  stage: joint
  batch_size: 2
  num_workers: 0
  epochs: 1
  early_stopping_patience: 1

paths:
  output_dir: /tmp/lfv_v7_pouring_smoke
