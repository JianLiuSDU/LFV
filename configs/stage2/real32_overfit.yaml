model:
  name: three_token_hierarchical_diffusion
  hidden_dim: 128
  encoder_heads: 4
  goal_layers: 4
  trajectory_layers: 4
  decoder_heads: 4
  dropout: 0.0
  num_train_timesteps: 100
  goal_inference_steps: 20
  trajectory_inference_steps: 20
  trajectory_position_encoding: discrete_sinusoidal

data:
  type: cached
  cache_root: /home/users1/ljian/lfv_data_cache/stage2/pouring_lfv_v1
  dino_dim: 384
  train_limit: 32
  overfit_same_as_train: true
  shuffle_points: true

runtime:
  seed: 42
  device: cuda
  allow_cpu_fallback: false

optimization:
  learning_rate: 0.0003
  min_learning_rate: 0.000003
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  ema_decay: 0.995
  amp: true

training:
  stage: joint
  batch_size: 8
  num_workers: 0
  epochs: 300
  early_stopping_patience: 100

paths:
  output_dir: /home/users1/ljian/lfv_runs/stage2/pouring_lfv_v1/real32_overfit
